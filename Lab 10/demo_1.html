<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 700px;
        height: 500px;

        position: relative;
      }
      .box {
        height: 100px;
        width: 100px;
        background-color: red;
        animation-name: color;
        animation-duration: 5s;
        position: absolute;
        animation-delay: 2s;
      }

      @keyframes color {
        0% {
          top: 0;
          left: 0;
        }

        25% {
          top: 0;
          left: 700px;
        }

        50% {
          top: 500px;
          left: 700px;
        }

        75% {
          top: 500px;
          left: 0;
        }

        100% {
          top: 0;
          left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
    </div>
  </body>
</html>
