<!DOCTYPE html>
<html>
<head>
<style>

.box {
    width: 80px;
    height: 80px;
    background: blue;

    animation: move 3s infinite alternate;
   animation-timing-function: steps(2);

    
}

@keyframes move {
    from {
        margin-left: 0;
    }

    to {
        margin-left: 400px;
    }
}

</style>
</head>

<body>

<div class="box"></div>
/* animation-timing-function: cubic-bezier(0, 0 ,1, 1); */
</body>
</html>
