<!DOCTYPE html>
<html>
<head>
<style>

.box {
    width: 80px;
    height: 80px;
    background: red;

    animation: move 4s steps(4) infinite;
}

@keyframes move {
    from {
        margin-left: 0;
    }

    to {
        margin-left: 400px;
    }
}

</style>
</head>

<body>

<div class="box"></div>

</body>
</html>
