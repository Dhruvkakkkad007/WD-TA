<!DOCTYPE html>
<html>
<head>
    <title>Flying Object Animation</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: skyblue;
        }

        .sky {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Flying Object */
        .rocket {
            position: absolute;

            width: 100px;
            height: 50px;

            background-color: red;

            border-radius: 50% 50% 20% 20%;

            animation: fly 8s infinite alternate ease-in-out;
        }

        /* Window of rocket */
        .rocket::before {
            content: "";

            position: absolute;

            width: 20px;
            height: 20px;

            background-color: white;

            border-radius: 50%;

            top: 15px;
            left: 25px;
        }

        /* Rocket tail */
        .rocket::after {
            content: "";

            position: absolute;

            width: 40px;
            height: 10px;

            background-color: orange;

            left: -35px;
            top: 20px;

            border-radius: 50%;
        }

        /* Flying Animation */
        @keyframes fly {

            0% {
                left: 0;
                top: 10%;
                transform: rotate(0deg);
            }

            25% {
                left: 25%;
                top: 30%;
                transform: rotate(10deg);
            }

            50% {
                left: 50%;
                top: 10%;
                transform: rotate(-10deg);
            }

            75% {
                left: 75%;
                top: 40%;
                transform: rotate(10deg);
            }

            100% {
                left: 90%;
                top: 15%;
                transform: rotate(0deg);
            }

        }

    </style>
</head>

<body>

    <div class="sky">

        <div class="rocket"></div>

    </div>

</body>
</html>
