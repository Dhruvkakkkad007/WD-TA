
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Div</title>

    <style>
        

        .box {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;

            animation-name: moveBox;
            animation-duration: 8s;
            animation-delay: 2s;
            animation-iteration-count: 1;
            animation-timing-function: linear;
        }

        @keyframes moveBox {

            /* Starting Point - Left Top */
            0% {
                left: 0px;
                top: 0px;
            }

            /* Move Left to Right */
            25% {
                left: 100%;
                top: 0px;
            }

            /* Move Right to Bottom */
            50% {
                left: 100%;
                top: 100%;
            }

            /* Move Bottom to Left */
            75% {
                left: 0px;
                top: 100%;
            }

            /* Move Left to Top */
            100% {
                left: 0px;
                top: 0px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box"></div>
    </div>

</body>
</html>
