<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        nav {
            display: flex;
            justify-content: center;
            background-color: gray; 
            padding: 10px;
        }
        nav a{
            text-decoration: none;
            margin: 10px;
            color: white;
        }
        .main-text{
            font-weight: bolder;
            font-size: xx-large;
            text-align: center;
             background-color: gainsboro;
        }

        .hero{
            display: flex;
            justify-content: space-around;
            background-color: gainsboro;
            padding: 10px;
            margin-top: 10px;
            
        }

        .offer{
            text-align: center;
            background-color: darkblue;
            color: white;

            padding: 10px;
        }
        button{
            border-radius: 4px;
            border: none;
            background-color: orange;
            color: white;
            padding: 10px;
            margin: 10px;
            cursor: pointer;
        }

        main{
            background-color: gainsboro;   
            display: flex;
            flex-direction: column;
        }

        .image{
            width: 50%;
        }

        .image img{
            height: 400px;
            width: 400px;
        }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="#">The Book Series</a>
        <a href="#">Testimonials</a>
        <a href="#">The Author</a>
        <a href="#">Free Resources</a>
      </nav>
    </header>
    <main>
         <p class="main-text">You dont know JavaScript</p>
      <section class="hero">
        
        <div class="image">
            <img src="demo.png" alt="">
        </div>  

        <div class="text">
          

          <p>Don't just drift through Javascript</p>

          <p>Understand how Javascript works</p>

          <p>Start your journey through the bumpy side of Javascript</p>

          <button>ORDER YOUR COPY NOW</button>
        </div>
      </section>
      </main>

      <section class="offer">
        <p>The first ebook in the book series is absolutely free.</p>

        <button>FIND OUT MORE ABOUT THIS OFFER</button>
      </section>
  
  </body>
</html>
