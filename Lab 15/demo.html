<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Cover</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ddd;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        /* Main Book */
        .book {
            width: 320px;
            height: 450px;

            border: 1px solid #555;
            border-radius: 8px;
            overflow: hidden;

            background-color: white;
        }

        /* ---------------- TOP SECTION ---------------- */

        .top {
            height: 100px;
            background-color: #e5e5e5;

            position: relative;
            padding: 10px;
        }

        /* O'Reilly Logo */
        .logo {
            background-color: #333;
            color: white;

            width: 65px;
            height: 20px;
            position: relative;
            top: -10px;
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 11px;
            font-weight: bold;
        }

        /* Quote */
        .quote {
            position: absolute;

            top: 15px;
            right: 12px;

            width: 190px;

            font-size: 7px;
            line-height: 1.3;

            text-align: center;
        }

        /* Author */
        .author {
            position: absolute;

            bottom: 8px;
            right: 18px;

            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }


        /* ---------------- MIDDLE SECTION ---------------- */

        .middle {
            height: 125px;

            background-color: white;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;
        }

        .middle h1 {
            font-size: 43px;
            font-weight: 400;

            line-height: 1.1;
        }


        /* ---------------- BOTTOM SECTION ---------------- */

        .bottom {
            height: 225px;

            background-color: #ffe33b;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Big JS */
        .js {
            font-size: 210px;
            font-weight: bold;

            letter-spacing: -20px;

            color: #222;

            margin-left: 35px;
        }

        /* Vertical Text */
        .vertical-text {
            position: absolute;

            left: 140px;
            top: 48px;

            color: #ffe33b;

            margin: 0 auto;
            padding: 5px 3px;

            font-size: 14px;
            font-weight: bold;
            
            
            
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }

    </style>
</head>

<body>

    <div class="book">

        <!-- TOP -->
        <div class="top">

            <div class="logo">
                O'REILLY
            </div>

            <p class="quote">
                "When you strive to comprehend your code,
                you create better work and become better at what
                you do. The code isn't just your job anymore,
                it's your craft."
                <br>
                — KYLE SIMPSON
            </p>

            <div class="author">
                KYLE SIMPSON
            </div>

        </div>


        <!-- MIDDLE -->
        <div class="middle">

            <h1>COMPLETE</h1>
            <h1>SERIES</h1>

        </div>


        <!-- BOTTOM -->
        <div class="bottom">

            <div class="vertical-text">
                YOU DON'T KNOW
            </div>

            <div class="js">
                JS
            </div>

        </div>

    </div>

</body>
</html>
