<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul li:nth-child(3){
            color: aqua;
        }
        ul li:first-child{
            color: red;
        }

        li::before{
            content: "Hello";
            margin-right: 10px;
        }

        li::after{
            content: "hi";
            margin-left: 10px;
        }

    </style>
</head>
<body>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>orange</li>
    </ul>
</body>
</html>
