
<!doctype html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>

        .container {
            display: flex;
            justify-content: space-between;
            margin: 10px;
            padding: 10px;
        }

        .box {
            background-color: orange;
            height: 300px;
            width: 300px;
            border: 2px solid black;
            margin: 10px;
        }

        #b1 {
            background-color: aqua;
        }

        #b2 {
            background-color: blueviolet;
        }

        #b3 {
            background-color: burlywood;
        }


       
        @media (min-width: 640px) {

            .container {
                flex-direction: row;
            }

        }


      
        @media (max-width: 639px) {

            .container {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="box" id="b1">
            Box 1
        </div>

        <div class="box" id="b2">
            Box 2
        </div>

        <div class="box" id="b3">
            Box 3
        </div>

    </div>

</body>

</html>
