<!DOCTYPE html>
<html>
<head>
  <title>Fixed Position Demo</title>

  <style>
    body {
      height: 1500px;
    }

    .box {
      width: 120px;
      height: 60px;
      background-color: lightcoral;
      border: 2px solid black;

      position: fixed;
      bottom: 20px;
      right: 20px;

      text-align: center;
      padding-top: 20px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <h1>Scroll Down ↓</h1>

  <div class="box">
    Fixed Box
  </div>

</body>
</html>
