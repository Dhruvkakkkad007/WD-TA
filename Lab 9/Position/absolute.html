<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Absolute Position Demo</title>

  <style>

    .parent {
      width: 500px;
      height: 300px;
      border: 4px solid black;
      margin: 50px auto;
      padding: 20px;

      /* IMPORTANT */
      position: relative;
    }

    .box {
      width: 120px;
      height: 70px;
      border: 2px solid black;
      text-align: center;
      padding-top: 20px;
      box-sizing: border-box;
    }

    .box1 {
      background-color: lightblue;
    }

    .box2 {
      background-color: lightcoral;

      /* IMPORTANT */
      position: absolute;

      top: 20px;
      right: 20px;
    }

    .box3 {
      background-color: lightgreen;
    }

    pre{
        font-size: larger;
        text-align: center;
    }

  </style>
</head>

<body>
    <pre>
        Parent → position: relative

        Child → position: absolute

        Child uses Parent as its reference
    </pre>
  <div class="parent">

    <div class="box box1">
      Box 1
    </div>

    <div class="box box2">
      Box 2
    </div>

    <div class="box box3">
      Box 3
    </div>

  </div>

</body>
</html>
