<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <style>

        /* ================= BASIC RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ================= BODY ================= */

        body {
            width: 95%;
            margin: auto;
        }


        /* ================= HEADER ================= */

        header {
            height: 140px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        /* ================= LOGO ================= */

        .logo img {
            width: 200px;
        }


        /* ================= NAVIGATION ================= */

        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            text-decoration: none;
            color: #222;
        }


        /* ================= HERO SECTION ================= */

        .hero {
            height: 260px;

            background-color: #eeeeee;

            /* Parent for absolute positioning */
            position: relative;

            /* Hide extra image area */
            overflow: hidden;
        }


        /* ================= HERO IMAGE ================= */

        .hero-image {
            width: 100%;
            height: 100%;
        }

        .hero-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* ================= HERO TEXT ================= */

        .hero-content {

            /* Text will be placed on the image */
            position: absolute;

            /* Move from top */
            top: 50%;

            /* Move from left */
            left: 70%;

            /* Center the text properly */
            transform: translate(-50%, -50%);

            width: 45%;

            padding: 20px;
        }


        .hero-content h1 {
            margin-bottom: 15px;
        }


        /* ================= PROGRAM SECTION ================= */

        .programs {
            display: flex;

            justify-content: space-around;

            padding: 20px 0;

            gap: 30px;
        }


        /* ================= PROGRAM BOX ================= */

        .program {
            width: 200px;
            height: 100px;

            border: 2px solid #c77;

            text-align: center;

            padding-top: 10px;
        }


        /* ================= FOOTER ================= */

        footer {
            height: 60px;

            display: flex;

            justify-content: center;
            align-items: center;

            background-color: #eeeeee;
        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <!-- LOGO -->

        <div class="logo">

            <img src="logo.png" alt="Darshan University Logo">

        </div>


        <!-- NAVIGATION -->

        <nav>

            <a href="#">Home</a>

            <a href="#">About</a>

            <a href="#">Services</a>

            <a href="#">My Work</a>

            <a href="#">Contact</a>

        </nav>

    </header>



    <!-- ================= MAIN ================= -->

    <main>


        <!-- ================= HERO SECTION ================= -->

        <section class="hero">


            <!-- IMAGE -->

            <div class="hero-image">

                <img src="image.png" alt="Web Developer">

            </div>


            <!-- TEXT -->

            <div class="hero-content">

                <h1>Hello, I am Web Developer</h1>

                <p>
                    I use HTML and CSS to convert webpage designs
                    into beautiful and efficient websites.
                </p>

            </div>


        </section>



        <!-- ================= PROGRAM SECTION ================= -->

        <section class="programs">


            <div class="program">
                Program 1
            </div>


            <div class="program">
                Program 2
            </div>


            <div class="program">
                Program 3
            </div>


            <div class="program">
                Program 4
            </div>


        </section>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 My Website | All Rights Reserved
        </p>

    </footer>


</body>

</html>
