<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Table</title>
</head>
<body>

    <!-- <table> → Creates the table.
    <tr> → Creates a row.
    <th> → Creates a header cell (bold).
    <td> → Creates a normal data cell. -->

        
    <table border="1" cellpadding="10" cellspacing="0">

        <tr>
            <th>Full Name</th>
            <th>Email</th>
            <th>Mobile No.</th>
            <th>City</th>
        </tr>

        <tr>
            <td>John Doe</td>
            <td>john.doe@example.com</td>
            <td>123-456-7890</td>
            <td>New York</td>
        </tr>

        <tr>
            <td>Jane Smith</td>
            <td>jane.smith@example.com</td>
            <td>987-654-3210</td>
            <td>Los Angeles</td>
        </tr>

        <tr>
            <td>Michael Johnson</td>
            <td>michael.johnson@example.com</td>
            <td>555-1234</td>
            <td>Chicago</td>
        </tr>

    </table>
</body>
</html>
