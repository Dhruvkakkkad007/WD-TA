<!doctype html>

  <title>Document</title>

  <style>
    .container {
      width: 90%;
      margin: auto;
      
    }

    
    header {
      height: 100px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid black;
      justify-content: space-between;
    }

   

     img {
      height: 90px;
      width: 99px;
      padding-left: 20px;
    }

    
    nav {
      width: 70%;
      text-align: center;
    }

    nav a {
      text-decoration: none;
      text-align: center;
      margin: 10px;
      font-size: 20px;
    }

    
    main {
      display: flex;
      min-height: 400px;
      align-items: stretch;
    }

    
    .left {
      width: 20%;
      display: flex;
      flex-direction: column;
      background-color: red;
      gap: 6px;
    }

    .menu {
      background-color: red;
      color: black;
      border: 1px solid yellow;
      font-size: 20px;
      padding: 30px;
      text-align: center;
    }

    .sidebar {
      background-color: red;
      border: 1px solid yellow;
      text-align: center;
      height: 50px;
      font-size: 20px;
      padding: 2px;
    }


    .right-content {
      width: 80%;
      padding: 10px;
      border: 2px solid black;
    }

    
    .card {
      width: 100px;
    }

   

    .card img {
      height: 115px;
      width: 120px;
    }

    .card p {
      margin: 2px 0;
      padding: 2px;
      padding-left: 22px;
    }

    
    footer {
      background-color: blue;
      text-align: center;
      color: white;
      padding: 10px;
      font-size: 20px;
    }

    .firstrow,
    .secondrow {
      display: flex;
      gap: 70px;
      margin-bottom: 20px;
    }
  </style>
</head>
