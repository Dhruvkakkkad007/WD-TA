<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
     body {
            font-family: Arial;
        }
      .page {
        width: 90%;
        background-color: aqua;
        padding: 15px;
        margin: auto;
      }

      .header {
        background-color: brown;
        padding: 10px;
      }

      .content {
        padding: 10px;
        background-color: orange;
        display: flex;
        gap: 50px;
        height: 250px;

      }

      .left-side {
        width: 70%;
      }

      .Entry {
        background-color: black;
        color: white;
        padding: 10px;
        margin-bottom: 15px;
      }

      .right-side{
        width: 30%;
      }

      .SideBar {
        background-color: black;
        color: white;
        height: 150px;
        padding: 10px;
        margin-top: 30px;
      }

      .footer {
        color: white;
        background-color: blue;
        padding: 10px;
      }

      .Content-title{
        margin-bottom: 10px;
      }

      @media screen and (max-width:768px) {
        .content {
          flex-direction: column;
          gap: 10px;
          height: auto;
        }

        .left-side{
          width: 100%;
        }

        .right-side{
          width: 100%;
        }

        .SideBar{
          margin-top: 10px;
        }

        @media  (min-width:500px) {
          .page {
            background-color: green;
          }

          @media screen and (max-width:500px) {
            .page{
              background-color: firebrick;
            }
            
          }
        }

      
      }
      
    </style>
  </head>
  <body>
    <div class="page">
      Page
      <div class="header">Header</div>

      <div class="content">
        
       
        
        <div class="left-side">
            <div class="Content-title">Content</div>
          <div class="Entry">Entry</div>
          <div class="Entry">Entry</div>
          <div class="Entry">Entry</div>
        </div>

        <div class="right-side">
          <div class="SideBar">SideBar</div>
        </div>

      </div>

      <div class="footer">&copy; Darshan University Rajkot</div>
    </div>
  </body>
</html>
