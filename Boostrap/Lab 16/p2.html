<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Typography</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <div class="container mt-3">

        <!-- Normal Heading -->
        <h4>
            Welcome to <span class="mark">Darshan University-Rajkot</span>
        </h4>

        <br>

        <!-- Strikethrough -->
        <p class="text-decoration-line-through">
            Darshan Institute of Engineering and Technology
        </p>

        
       
        <!-- Strikethrough using del -->
        <p>
            <del>
                Darshan Institute of Engineering and Technology
            </del>
        </p>

        <!-- Underline -->
        <p class="text-decoration-underline">
            Darshan University-Rajkot
        </p>

        <!-- Underline using u -->
        <p>
            <u>
                Darshan University-Rajkot
            </u>
        </p>

        <!-- Normal Text -->
        <p>
            Darshan University-Rajkot
        </p>

        <!-- Bold Text(Basic) -->
        <p class="h2">
            Darshan University-Rajkot
        </p>

    <!-- or (Advanced)-->
        <p class="fw-bold">
            Darshan University-Rajkot
        </p>

        <i>Darshan University-Rajkot</i>

    </div>

</body>

</html>
