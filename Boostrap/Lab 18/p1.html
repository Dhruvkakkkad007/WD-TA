<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign In</title>

    <!-- Bootstrap 5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Main Container -->
    <div
      class="container min-vh-100 d-flex flex-column justify-content-center align-items-center"
    >
      <!-- Login Content -->` 
      <div class="w-25">
        <!-- Logo -->
        <div class="text-center mb-4">
         <img src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo-shadow@2x.png" height="200px" width="200px" alt="">
          </div>
        </div>

        <!-- Heading -->
        <h2 class="text-center mb-4">Please sign in</h2>

        <!-- Email -->
        <input type="email" class="form-control w-25" placeholder="Email address" />

        <!-- Password -->
        <input
          type="password"
          class="form-control mt-2 w-25"
          placeholder="Password"
        />

        <!-- Remember Me -->
        <div
          class="form-check d-flex align-items-center justify-content-center gap-1 m-2">
          <input class="form-check-input m-0" type="checkbox" id="rememberMe" />
          <label class="form-check-label" for="rememberMe"> Remember me </label>
        </div>

        <!-- Sign In Button -->
        <button class="btn btn-primary w-25 py-2 mt-2">Sign in</button>

        <!-- Footer -->
        <p class="text-center text-muted mt-5">&copy; 2017-2018</p>
      </div>
    </div>
  </body>
</html>
