<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>

    <label for="fullname">Full Name:</label>
    <input
        type="text"
        id="fullname"
        name="fullname"
        minlength="3"
        maxlength="50"
        required
    >

    <br><br>

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <br><br>

    <label for="age">Age:</label>
    <input
        type="number"
        id="age"
        name="age"
        min="18"
        max="60"
        required
    >

    <br><br>

    <label for="phone">Phone:</label>
    <input
        type="tel"
        id="phone"
        name="phone"
        pattern="[6-9][0-9]{9}"
        required
    >

    <br><br>

    <label for="password">Password:</label>
    <input
        type="password"
        id="password"
        name="password"
        minlength="8"
        pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}"
        required
    >

    <br><br>

    <button type="submit">Register</button>

</form>

</body>
</html>
